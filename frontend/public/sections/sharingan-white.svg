<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="40" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <!-- Middle ring -->
  <circle cx="50" cy="50" r="28" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="16" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Center pupil -->
  <circle cx="50" cy="50" r="5" fill="white" opacity="0.95"/>
  <!-- Crosshair lines -->
  <line x1="50" y1="10" x2="50" y2="34" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="66" x2="50" y2="90" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="10" y1="50" x2="34" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="66" y1="50" x2="90" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Diagonal lines -->
  <line x1="21.7" y1="21.7" x2="38.8" y2="38.8" stroke="white" stroke-width="1.2" opacity="0.45"/>
  <line x1="61.2" y1="61.2" x2="78.3" y2="78.3" stroke="white" stroke-width="1.2" opacity="0.45"/>
  <line x1="78.3" y1="21.7" x2="61.2" y2="38.8" stroke="white" stroke-width="1.2" opacity="0.45"/>
  <line x1="38.8" y1="61.2" x2="21.7" y2="78.3" stroke="white" stroke-width="1.2" opacity="0.45"/>
</svg>
