<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 200" fill="none">
  <!-- Kunai blade -->
  <path d="M32 8 L44 80 L32 75 L20 80 Z" fill="white" opacity="0.95"/>
  <!-- Blade edge highlight -->
  <path d="M32 8 L36 80 L32 75 Z" fill="white" opacity="0.7"/>
  <!-- Blade center line -->
  <line x1="32" y1="12" x2="32" y2="72" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <!-- Handle wrap -->
  <rect x="28" y="80" width="8" height="60" rx="2" fill="white" opacity="0.85"/>
  <!-- Handle wrap lines -->
  <line x1="28" y1="88" x2="36" y2="88" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="96" x2="36" y2="96" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="104" x2="36" y2="104" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="112" x2="36" y2="112" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="120" x2="36" y2="120" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="128" x2="36" y2="128" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="28" y1="136" x2="36" y2="136" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <!-- Handle guard -->
  <rect x="22" y="78" width="20" height="5" rx="2" fill="white" opacity="0.9"/>
  <!-- Ring pommel -->
  <circle cx="32" cy="155" r="12" stroke="white" stroke-width="4" fill="none" opacity="0.9"/>
  <!-- Ring inner -->
  <circle cx="32" cy="155" r="7" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Connecting ring to handle -->
  <rect x="29" y="140" width="6" height="8" rx="1" fill="white" opacity="0.85"/>
</svg>
