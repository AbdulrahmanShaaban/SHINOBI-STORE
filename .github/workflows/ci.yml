name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shinobi
          POSTGRES_PASSWORD: shinobi_dev_password
          POSTGRES_DB: shinobi_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shinobi -d shinobi_store"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shinobi:shinobi_dev_password@localhost:5432/shinobi_store?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + OpenAPI contracts
        run: |
          pnpm --filter backend prisma:generate
          pnpm --filter backend openapi:generate
          pnpm --filter @shinobi/contracts generate

      - name: Apply migrations + seed
        run: |
          pnpm --filter backend db:deploy
          pnpm --filter backend db:seed

      # Turborepo local cache, shared across runs via actions/cache. Stale
      # entries are harmless — every task result is keyed by a content hash of
      # its inputs (files + globalEnv), so only matching hashes are restored.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint backend
        run: pnpm exec turbo run lint --filter=backend --cache-dir=.turbo

      # Non-blocking: legacy marketing components carry pre-existing lint debt
      # (react-hooks rules in GSAP sections, unescaped entities). Tracked for the
      # frontend rebuild phase — flip to blocking once cleaned up.
      - name: Lint frontend (non-blocking)
        run: pnpm exec turbo run lint --filter=frontend --cache-dir=.turbo
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec turbo run typecheck --cache-dir=.turbo

      - name: Unit tests (backend)
        run: pnpm exec turbo run test --filter=backend --cache-dir=.turbo

      # Runs the full request pipeline; with services up, readiness must be green.
      - name: E2E API tests
        run: pnpm exec turbo run test:e2e --cache-dir=.turbo

      # Real-database data correctness: visibility, filter matrix, triggers.
      - name: Integration tests (live DB)
        run: pnpm exec turbo run test:int --cache-dir=.turbo

      # Next.js .next output and NestJS dist are cached between runs; unchanged
      # packages replay from cache instead of rebuilding.
      - name: Build all workspaces
        run: pnpm exec turbo run build --cache-dir=.turbo

      # Non-blocking initially — triage existing advisories, then flip to blocking.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  security:
    name: Secrets · Prod dependency audit (blocking)
    runs-on: ubuntu-latest

    steps:
      # Full history so gitleaks scans every commit, not just the shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate: production dependencies must carry no moderate-or-worse
      # advisories. Triage by upgrading/overriding, never by lowering this bar.
      - name: Dependency audit (prod, blocking gate)
        run: pnpm audit --prod --audit-level moderate
